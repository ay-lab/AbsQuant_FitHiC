# Portable environment for AbsLoopQuant_TB.
#
# Dependencies are derived from what the code in this repo actually imports,
# plus the packages the wider AbsLoopQuant analysis codebase needs, so an env
# built from this file also passes 0.1_Check_AbsLoopQuant_Envs.sh cleanly.
#
#   1.1_calculate_P_s_curves_general.py : cooler, cooltools, numpy, matplotlib,
#                                         scipy, looptools*
#   1.2_filter_loops.py                 : cooler, cv2, numpy, pandas
#   looptools.py                        : cooler, cooltools, matplotlib, scipy,
#                                         numpy, pandas
#   *looptools is a local module in this directory; the generated jobs `cd`
#    here first, so it needs no install.
#
# Build with:
#     bash create_absloopquantTB_env.sh
#
# For the exact, build-pinned env that was validated on the LJI cluster, use
# absloopquantTB_env.lock.yml (linux-64 only).
name: absloopquantTB
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10

  # --- load-bearing pins ----------------------------------------------------
  # numpy<2: several packages here (cooler, cooltools, py-opencv, numba) ship
  # C extensions built against the numpy 1.x ABI. numpy 2 breaks them at import
  # with no useful error.
  - numpy<2
  # matplotlib-base<3.9: cooltools.lib.plotting still imports register_cmap,
  # which matplotlib 3.9 removed, and its fallback
  #   `from matplotlib.colormaps import register`
  # targets a submodule that has never existed -- so both paths fail. looptools
  # imports cooltools.lib.plotting at module level, which means P(s) curves die
  # at import without this pin. matplotlib-base (not matplotlib) keeps Qt out of
  # a headless SLURM env; mpl_toolkits.axes_grid1 is included in it.
  - matplotlib-base<3.9

  # --- required by this repo ------------------------------------------------
  - pandas
  - scipy
  - cooler
  - cooltools
  - bioframe
  - py-opencv          # provides cv2, which 1.2_filter_loops.py needs
  - h5py               # .mcool / .cool are HDF5

  # --- used elsewhere in the AbsLoopQuant codebase --------------------------
  # Not imported by the three scripts here, but kept so that one env serves the
  # whole toolkit and the env checker reports no gaps.
  - biopython
  - pybedtools
  - pybigwig
  - pyfaidx
  - multiprocess

  - pip
